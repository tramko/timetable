# Osvježavanje voznog reda bez izdanja aplikacije (vidi "Zastarjeli vozni red" u CLAUDE.md ZetLivea).
# Izvor je u ZetLive repozitoriju (tools/timetable-job/); u repozitorij s podacima ga kopira sync.sh.
name: Vozni red

on:
  schedule:
    - cron: "17 * * * *" # svaki sat; ZIP se skida, a baza gradi samo kad se ZIP ili kod za izgradnju promijeni
    - cron: "40 7 * * *" # svaki dan u 8:40/9:40 po zagrebačkom: spaja li se objavljeni vozni red s feedom uživo
  workflow_dispatch:

permissions:
  contents: write

concurrency: timetable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: build
        if: github.event.schedule != '40 7 * * *'
        run: >
          python3 -I tools/publish_timetable.py --out out
          --latest-manifest "https://github.com/${{ github.repository }}/releases/latest/download/manifest.json"
          --base-url "https://github.com/${{ github.repository }}/releases/download/{tag}"
      # Potpis manifesta (Ed25519); aplikacija bez valjanog potpisa ne vjeruje manifestu. Ključ je samo u tajni.
      - if: steps.build.outputs.changed == 'true'
        env:
          SIGNING_KEY: ${{ secrets.TIMETABLE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "nema tajne TIMETABLE_SIGNING_KEY"; exit 1; }
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/key.pem" -in out/manifest.json -out "$RUNNER_TEMP/manifest.bin"
          base64 -w0 "$RUNNER_TEMP/manifest.bin" > out/manifest.sig
          rm -f "$RUNNER_TEMP/key.pem"
      - if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.build.outputs.tag }}" out/*
          --title "Vozni red ${{ steps.build.outputs.tag }}"
          --notes "Izvor podataka: ZET d.o.o., Otvorena dozvola (https://data.gov.hr/otvorena-dozvola)"
          --latest
      # Pada (pa GitHub šalje e-mail) ako se zadnji objavljeni vozni red ne spaja s feedom uživo: ZET je promijenio vozni
      # red, a novi nije objavljen (npr. ZIP je na novoj adresi). Zato se pokreće i nakon objave, u istom poslu.
      - name: Provjera s feedom uživo
        if: github.event.schedule == '40 7 * * *' || github.event_name == 'workflow_dispatch'
        run: >
          python3 -I tools/publish_timetable.py --health
          --latest-manifest "https://github.com/${{ github.repository }}/releases/latest/download/manifest.json"
      # GitHub gasi zakazane poslove u repozitoriju bez aktivnosti 60 dana; prazan commit svakih ~45 dana to sprječava.
      - name: Keepalive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
